    function renderTimeline(day) {
        let timelineHtml = `<div class="timeline-container">`;
        
        day.events.forEach((event, index) => {
            const isLast = index === day.events.length - 1;
            const eventId = `event-${day.dayNum}-${index}`;
            const hasExtraInfo = event.desc || (event.links && event.links.length > 0) || event.warning;
            
            let cardClass = "event-spot";
            if(event.type === 'transport') cardClass = "event-transport";
            if(event.type === 'food') cardClass = "event-food";
            if(event.type === 'hotel') cardClass = "event-hotel";
            if(event.type === 'flight') cardClass = "event-flight";
            if(event.type === 'goshuin') cardClass = "event-goshuin";

            timelineHtml += `
                <div class="relative mb-6 ${cardClass}">
                    ${!isLast ? `<div class="timeline-line"></div>` : ''}
                    <div class="timeline-dot"></div>
                    
                    <div class="ml-8 timeline-content">
                        
                        <div class="flex justify-between items-start">
                            <div class="flex-1" ${hasExtraInfo ? `onclick="toggleEventDetail('${eventId}')" style="cursor:pointer;"` : ''}>
                                ${event.warning ? `
                                    <div class="bg-red-50 text-red-600 text-xs px-2 py-1 rounded mb-2 inline-flex items-center gap-1 font-medium border border-red-100">
                                        ⚠️ ${event.warning}
                                    </div>
                                ` : ''}

                                <div class="flex justify-between items-start gap-2">
                                    <div>
                                        <div class="text-xs font-bold text-sky-600 mb-1">${event.time}</div>
                                        <div class="font-bold text-slate-800 flex items-center gap-1.5 flex-wrap">
                                            <span>${event.icon}</span>
                                            <span class="${event.hasGoshuin ? 'text-red-600' : ''}">${event.title}</span>

        if (window._tempGoshuinList[idx]) {

        }
    }

        const daySelect = document.getElementById('new-goshuin-day');
        const nameInput = document.getElementById('new-goshuin-name');
        const day = daySelect.value;
        const name = nameInput.value.trim();

        if (name) {
            window._tempGoshuinList.push({ day, name });
            nameInput.value = '';
            document.getElementById('goshuin-editor-list').innerHTML = renderGoshuinEditorListHtml();

            showToast('請輸入神社或寺院名稱');

        window._tempGoshuinList.splice(idx, 1);

        const modal = document.getElementById('goshuin-manager-modal');

        delete window._tempGoshuinList;

            list.forEach(item => {
                const amt = parseFloat(item.amount) || 0;

                else if (item.currency === 'JPY') totalJPY += amt;

                <div class="text-center">
                    <div class="text-xs text-sky-100 font-medium">總計日幣 (JPY)</div>
                    <div class="text-2xl font-black mt-1">¥ ${totalJPY.toLocaleString()}</div>
                </div>

        appData.days.forEach(day => {
            const dayExpenses = state.expenses[day.dayNum] || [];
            let dayTWD = 0;
            let dayJPY = 0;

                const amt = parseFloat(item.amount) || 0;

    function saveExpenseItem(e, oldDayNum, oldIndex) {
        e.preventDefault();
        const newDayNum = Number(document.getElementById('exp-day').value);
        const title = document.getElementById('exp-title').value.trim();
        const amount = parseFloat(document.getElementById('exp-amount').value);
        const currency = document.getElementById('exp-currency').value;
        const payer = document.getElementById('exp-payer').value;
        const paymentMethod = document.getElementById('exp-method').value;

        if (!title || isNaN(amount)) {
            showToast('請完整輸入項目與金額');
            return;
        }

        if (oldDayNum !== null && oldIndex !== null) {
            state.expenses[oldDayNum].splice(oldIndex, 1);
        }

        if (!state.expenses[newDayNum]) {
            state.expenses[newDayNum] = [];
        }

        state.expenses[newDayNum].push({ title, amount, currency, payer, paymentMethod });
        saveState();
        closeExpenseModal();
        renderExpenses();

        e.preventDefault();

        const val = input.value.trim();

            saveState();
            renderNotes();
            showToast('已新增備忘錄');

    function removeMemoItem(id) {
        state.notes = state.notes.filter(m => m.id !== id);

        renderNotes();
        showToast('已刪除備忘錄');
    }

    function toggleEditMemo(id) {
        const textEl = document.getElementById(`memo-text-${id}`);
        const editEl = document.getElementById(`memo-edit-${id}`);
        const editBtn = document.getElementById(`memo-edit-btn-${id}`);
        const saveBtn = document.getElementById(`memo-save-btn-${id}`);

        textEl.classList.toggle('hidden');
        editEl.classList.toggle('hidden');
        editBtn.classList.toggle('hidden');
        saveBtn.classList.toggle('hidden');
        if (!editEl.classList.contains('hidden')) {
            editEl.focus();
        }

    function saveEditMemo(id) {
        const editEl = document.getElementById(`memo-edit-${id}`);
        const val = editEl.value.trim();

            const memo = state.notes.find(m => m.id === id);

        }

    function saveEventChanges(e, dayNum, eventIndex) {
        e.preventDefault();
        const day = appData.days.find(d => d.dayNum === dayNum);
        const event = day.events[eventIndex];

        event.time = document.getElementById('edit-time').value.trim();
        event.icon = document.getElementById('edit-icon').value.trim();
        event.title = document.getElementById('edit-title').value.trim();
        
        const descVal = document.getElementById('edit-desc').value.trim();
        if(descVal) event.desc = descVal; else delete event.desc;

        const transVal = document.getElementById('edit-transport').value.trim();
        if(transVal) event.transport = transVal; else delete event.transport;

        const warnVal = document.getElementById('edit-warning').value.trim();
        if(warnVal) event.warning = warnVal; else delete event.warning;

        if (window._tempModalLinks && window._tempModalLinks.length > 0) {
            event.links = window._tempModalLinks;
        } else {
            delete event.links;
        }

        saveState();
        closeEditModal();
        renderItineraryList();
        showToast('行程已成功更新');
    }

    function showToast(message) {
        const existingToast = document.getElementById('toast-notification');
        if(existingToast) existingToast.remove();

        const toast = document.createElement('div');
        toast.id = 'toast-notification';
        toast.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50 fade-in';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;').replace("'", '&#039;');
    }
